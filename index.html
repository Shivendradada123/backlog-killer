<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
PCM Backlog Tracker
</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);

padding:15px;

color:white;

min-height:100vh;

}

h1{

text-align:center;

margin-bottom:20px;

font-size:28px;

color:#38bdf8;

}

.container{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(280px,1fr)
);

gap:15px;

max-width:1000px;

margin:auto;

}

.card{

background:#1e293b;

padding:18px;

border-radius:18px;

box-shadow:

0 0 15px

rgba(
0,
255,
255,
0.15
);

}

.card h2{

text-align:center;

margin-bottom:15px;

}

input{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#334155;

color:white;

font-size:16px;

margin-bottom:10px;

outline:none;

}

button{

border:none;

padding:10px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

font-size:16px;

}

.add{

width:100%;

background:#22c55e;

color:white;

margin-bottom:12px;

}

.item{

background:#334155;

padding:10px;

border-radius:12px;

margin-top:10px;

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

flex-wrap:wrap;

}

.controls{

display:flex;

align-items:center;

gap:8px;

}

.plus{

background:#3b82f6;

color:white;

width:35px;

height:35px;

}

.minus{

background:#ef4444;

color:white;

width:35px;

height:35px;

}

.delete{

background:#ff4444;

color:white;

width:35px;

height:35px;

}

.count{

font-size:18px;

font-weight:bold;

min-width:25px;

text-align:center;

}

.footer{

text-align:center;

margin-top:30px;

color:#94a3b8;

font-size:14px;

font-weight:bold;

}

@media(max-width:500px){

h1{

font-size:22px;

}

.item{

flex-direction:column;

}

}

</style>

</head>

<body>

<h1>
📚 PCM Backlog Tracker
</h1>

<div class="container">

<div class="card">

<h2>
⚡ Physics
</h2>

<input
id="physicsInput"
placeholder="Chapter Name">

<button
class="add"
onclick="add('physics')">

ADD

</button>

<div id="physics"></div>

</div>


<div class="card">

<h2>
🧪 Chemistry
</h2>

<input
id="chemistryInput"
placeholder="Chapter Name">

<button
class="add"
onclick="add('chemistry')">

ADD

</button>

<div id="chemistry"></div>

</div>


<div class="card">

<h2>
📐 Maths
</h2>

<input
id="mathsInput"
placeholder="Chapter Name">

<button
class="add"
onclick="add('maths')">

ADD

</button>

<div id="maths"></div>

</div>

</div>

<div class="footer">

Website Made by Shivendra ❤️

</div>

<script>

loadData();

function add(subject){

let input=

document.getElementById(
subject+"Input"
);

let name=

input.value.trim();

if(name==""){

return;

}

let data=getData();

data[subject].push({

chapter:name,

count:0

});

saveData(data);

render();

input.value="";

}

function plus(
subject,
index
){

let data=getData();

data[subject]
[index]
.count++;

saveData(data);

render();

}

function minus(
subject,
index
){

let data=getData();

if(

data[subject]
[index]
.count>0

){

data[subject]
[index]
.count--;

}

saveData(data);

render();

}

function removeItem(
subject,
index
){

let data=getData();

data[subject]
.splice(index,1);

saveData(data);

render();

}

function getData(){

return JSON.parse(

localStorage
.getItem(
"pcmBacklog"
)

)||{

physics:[],

chemistry:[],

maths:[]

};

}

function saveData(data){

localStorage.setItem(

"pcmBacklog",

JSON.stringify(data)

);

}

function loadData(){

render();

}

function render(){

let data=getData();

[

"physics",
"chemistry",
"maths"

]

.forEach(subject=>{

let box=

document
.getElementById(subject);

box.innerHTML="";

data[subject]
.forEach(
(item,index)=>{

box.innerHTML+=`

<div class="item">

<span>

${item.chapter}

</span>

<div class="controls">

<button
class="minus"

onclick=

"minus(
'${subject}',
${index}
)"

>

-

</button>

<span
class="count">

${item.count}

</span>

<button
class="plus"

onclick=

"plus(
'${subject}',
${index}
)"

>

+

</button>

<button
class="delete"

onclick=

"removeItem(
'${subject}',
${index}
)"

>

✖

</button>

</div>

</div>

`;

});

});

}

</script>

</body>

</html>
